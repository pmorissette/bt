name: Regression and Version Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
   group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
   cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: dev

    strategy:
      matrix:
        python-version:
          - 3.11
        os:
          - ubuntu-latest
        pandas_version:
          - '>=1,<2'
          - '>=2,<3'
          - '>=3,<4'
        numpy_version:
          - '<2'
          - '>=2'
        exclude:
          - numpy_version: '>=2'
            pandas_version: '>=1,<2'

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions-ext/python/setup@c8228d827a81b9f8c808825328af361c45461ba3
      with:
        version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: make develop

    - name: Install specific pandas and numpy versions
      run: pip install "pandas${{ matrix.pandas_version }}" "numpy${{ matrix.numpy_version }}"

    - name: Test
      run: make test
